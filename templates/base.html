<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Relatórios de Avaliação{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <h1>Relatórios de Avaliação do Apoio Técnico</h1>
    <nav>
      <a href="{{ url_for('index', semana=semana.isoformat() if semana) }}" class="{{ 'ativa' if request.endpoint == 'index' }}">Semana</a>
      <a href="{{ url_for('revisao', semana=semana.isoformat() if semana) }}" class="{{ 'ativa' if request.endpoint == 'revisao' }}">Revisão{% if n_revisar %} <span class="badge">{{ n_revisar }}</span>{% endif %}</a>
    </nav>
  </header>
  <main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
